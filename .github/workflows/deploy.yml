name: Deploy FiniSpeak

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: finispeak-prod

      - name: Verify OpenAI transcription secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Configure DigitalOcean SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/finispeak_deploy
          chmod 600 ~/.ssh/finispeak_deploy
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          rsync -az --delete \
            --exclude='venv/' \
            --exclude='.env' \
            --exclude='.git/' \
            -e "ssh -i $HOME/.ssh/finispeak_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$DO_USER@$DO_HOST:/var/www/finispeak/"

          ssh -i ~/.ssh/finispeak_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DO_USER@$DO_HOST" \
            'set -e
             /var/www/finispeak/venv/bin/python -m pip install -r /var/www/finispeak/requirements.txt
             sudo /usr/bin/systemctl restart finispeak.service
             sudo /usr/bin/systemctl is-active --quiet finispeak.service'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Rules
        run: firebase deploy --only firestore:rules,storage --project finispeak --non-interactive
